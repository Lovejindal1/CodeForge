<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="cf-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1e1e"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="cf-orange" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffa116"/>
      <stop offset="1" stop-color="#ff6b22"/>
    </linearGradient>
    <linearGradient id="cf-slash" x1="16" y1="4" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffc166"/>
      <stop offset="1" stop-color="#ffa116"/>
    </linearGradient>
    <filter id="cf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="32" height="32" rx="7" fill="url(#cf-bg)" stroke="#ffa116" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Glow effect inside -->
  <circle cx="16" cy="16" r="10" fill="#ffa116" fill-opacity="0.08" filter="url(#cf-glow)"/>

  <!-- CodeForge Code Brackets and Slash < / > -->
  <g filter="url(#cf-glow)">
    <!-- Left Bracket < -->
    <path d="M10 9L4.5 16L10 23" stroke="url(#cf-orange)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Bracket > -->
    <path d="M22 9L27.5 16L22 23" stroke="url(#cf-orange)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Middle Slash / -->
    <path d="M18 6L14 26" stroke="url(#cf-slash)" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>